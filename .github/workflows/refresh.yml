# Daily data refresh: new episodes, announced titles and where-to-watch from TMDB, deployed to Firebase Hosting.
# It deploys the code on main, so main must always match what is live.
# Google sign-in is keyless (Workload Identity Federation): no Google key is stored anywhere, and Google
# accepts only this workflow file, on main, in this repository. The service account can deploy Hosting and nothing else.
name: Refresh data

on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # lets Google verify the run (keyless sign-in)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: pip install -r tools/requirements.txt

      - name: Pull data from TMDB
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          python tools/build_upcoming.py
          python tools/build_watch.py

      - name: Compare with the live site
        id: diff
        run: |
          changed=false
          if [ -n "$(git ls-files -d public)" ]; then changed=true; fi
          while IFS= read -r f; do
            [ "$changed" = true ] && break
            curl -fsS --retry 2 "https://sacredtimeline.web.app/${f#public/}" | cmp -s - "$f" || changed=true
          done < <(git ls-files -mo --exclude-standard public)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Live site differs: $changed"

      - if: steps.diff.outputs.changed == 'true'
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: projects/1082620807275/locations/global/workloadIdentityPools/github/providers/mcu-timeline
          service_account: site-refresh@mcu-yggdrasil-tk.iam.gserviceaccount.com

      - if: steps.diff.outputs.changed == 'true'
        run: npx --yes firebase-tools@15.34.0 deploy --only hosting --project mcu-yggdrasil-tk --non-interactive
